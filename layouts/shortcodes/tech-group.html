{{ $items := split (.Get "items") "|" }}
<div class="rounded-xl border border-gray-200 bg-white/70 p-4 shadow-sm transition-colors hover:border-primary-300 dark:border-white/[0.08] dark:bg-white/[0.03] dark:hover:border-primary-500/40">
  <p class="m-0 text-xs font-semibold uppercase tracking-[0.16em] text-gray-500 dark:text-gray-400">{{ .Get "title" }}</p>
  <div class="mt-3 flex flex-wrap gap-2">
    {{ range $items }}
      <span class="rounded-full border border-primary-200 bg-primary-50 px-2.5 py-1 text-xs font-medium text-primary-700 dark:border-primary-500/20 dark:bg-primary-500/10 dark:text-primary-300">{{ trim . " " }}</span>
    {{ end }}
  </div>
</div>
